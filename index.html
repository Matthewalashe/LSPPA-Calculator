<script>
  /* =========================
     HERO DOT SWARM (CANVAS)
     - 1000–2000 dots
     - cursor attractor
     - NO O(n^2) connecting lines (performance)
     ========================= */
  const canvas = document.getElementById("swarm");
  const ctx = canvas.getContext("2d", { alpha: true });

  const DPR = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0;

  const pointer = { x: 0.5, y: 0.5, vx: 0, vy: 0, active: false };
  let dots = [];
  let rafId = null;

  // Clamp count between 1000 and 2000, but scale with viewport area
  function getDotCount() {
    // tweak divisor to taste: smaller = more dots on same screen
    const byArea = Math.floor((W * H) / 900);
    return Math.max(1000, Math.min(2000, byArea));
  }

  function resize() {
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || (window.innerHeight - 72);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function makeDots() {
    const count = getDotCount();
    dots = Array.from({ length: count }).map(() => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      // slightly smaller dots for dense field
      r: 0.7 + Math.random() * 1.4,
      // lower alpha so 2000 doesn’t turn into a fog
      a: 0.08 + Math.random() * 0.14,
      tint: Math.random() < 0.55 ? "blue" : "green"
    }));
  }

  function onMove(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    const nx = x * W;
    const ny = y * H;

    pointer.vx = (nx - pointer.x) * 0.06;
    pointer.vy = (ny - pointer.y) * 0.06;
    pointer.x = nx;
    pointer.y = ny;
    pointer.active = true;
  }

  function onLeave() {
    pointer.active = false;
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);

    const tx = pointer.active ? pointer.x : W * 0.5;
    const ty = pointer.active ? pointer.y : H * 0.5;

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];

      const dx = tx - d.x;
      const dy = ty - d.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;

      // attract strength (slightly softer for huge counts)
      const pull = pointer.active ? Math.min(1, 160 / dist) : 0.05;

      d.vx += (dx / dist) * 0.0085 * pull + pointer.vx * 0.00025;
      d.vy += (dy / dist) * 0.0085 * pull + pointer.vy * 0.00025;

      // friction
      d.vx *= 0.987;
      d.vy *= 0.987;

      // limit speed
      const sp = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
      const max = 0.95;
      if (sp > max) {
        d.vx = (d.vx / sp) * max;
        d.vy = (d.vy / sp) * max;
      }

      // integrate
      d.x += d.vx;
      d.y += d.vy;

      // wrap bounds
      if (d.x < -30) d.x = W + 30;
      if (d.x > W + 30) d.x = -30;
      if (d.y < -30) d.y = H + 30;
      if (d.y > H + 30) d.y = -30;

      const c = d.tint === "blue"
        ? `rgba(11,77,162,${d.a})`
        : `rgba(0,135,83,${d.a})`;

      ctx.beginPath();
      ctx.fillStyle = c;
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    rafId = requestAnimationFrame(tick);
  }

  function initSwarm() {
    resize();
    makeDots();
    if (rafId) cancelAnimationFrame(rafId);
    tick();
  }

  // reduced motion: keep static dots (no animation)
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduceMotion) {
    initSwarm();
    window.addEventListener("resize", () => { resize(); makeDots(); }, { passive: true });
    window.addEventListener("pointermove", onMove, { passive: true });
    window.addEventListener("pointerleave", onLeave, { passive: true });
  } else {
    resize();
    makeDots();
    ctx.clearRect(0, 0, W, H);
    dots.forEach(d => {
      ctx.beginPath();
      ctx.fillStyle = d.tint === "blue" ? "rgba(11,77,162,0.14)" : "rgba(0,135,83,0.10)";
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    });
    window.addEventListener("resize", () => { resize(); makeDots(); }, { passive: true });
  }
</script>
